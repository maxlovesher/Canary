# Lint + offline test suite. No model or network calls: every test uses mocked
# HTTP (httpx.MockTransport) and synthetic placeholder data.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: |
          uvx ruff check src tests scripts
          uvx ruff format --check src tests scripts
      - name: Test
        run: uv run pytest
