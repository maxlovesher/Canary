# Milestone 1: JailbreakBench direct requests against a local Ollama model,
# judged by refusal patterns (proxy ASR = non-refusal rate).
#
#   python scripts/fetch_jbb.py                      # once
#   redbench validate configs/m1_jbb_direct.yaml
#   redbench run configs/m1_jbb_direct.yaml --set run.max_cases=5   # smoke run
#   redbench run configs/m1_jbb_direct.yaml

run:
  name: m1-jbb-direct
  seed: 1234
  output_dir: runs
  max_cases: null              # e.g. 5 for a smoke run
  cache:
    mode: read_write           # read_write | read_only (strict replay) | off
    path: .cache/responses.sqlite

target:
  type: ollama_chat
  params:
    model: qwen3:4b            # placeholder default: already pulled on the dev machine
    base_url: http://localhost:11434
    system_prompt: "You are a helpful assistant."
    temperature: 0.0
    max_tokens: 2048           # reasoning + answer share this budget for thinking models
    # qwen3:4b always reasons. think: true keeps the reasoning in a separate field so the
    # judge sees only the final answer. think: false does NOT disable reasoning on this
    # build; it leaks untagged reasoning into the answer (observed with Ollama 0.15.1).
    think: true
    timeout_s: 120
    retries: 2

attacks:
  - type: jailbreakbench
    params:
      path: data/raw/jbb/harmful-behaviors.csv
      expected_sha256: null    # paste the hash printed by scripts/fetch_jbb.py to pin the dataset
      categories: null         # null = all categories
      sample: null             # integer = random subset drawn with run.seed

judge:
  type: refusal_patterns
  params:
    use_default_patterns: true
    extra_patterns: []
    window_chars: 300

pricing:                       # USD per million tokens; 0 for local models
  input_per_mtok: 0.0
  output_per_mtok: 0.0
